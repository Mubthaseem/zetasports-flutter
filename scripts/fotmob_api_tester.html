<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZetaSports — FotMob API Tester</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0e1a;
    color: #e0e6f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    padding: 24px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  header h1 { font-size: 1.4rem; font-weight: 700; color: #fff; }
  header span { font-size: 0.85rem; color: #6b7a99; }

  .search-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
  }
  .search-bar input {
    flex: 1;
    background: #141929;
    border: 1px solid #2a3352;
    border-radius: 10px;
    color: #e0e6f0;
    font-size: 0.95rem;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: #4f8cff; }
  .search-bar input::placeholder { color: #3d4f70; }
  .btn {
    background: #4f8cff;
    border: none;
    border-radius: 10px;
    color: #fff;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 12px 24px;
    transition: background 0.2s, transform 0.1s;
  }
  .btn:hover { background: #3a7aee; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { background: #2a3352; cursor: not-allowed; }

  .match-info {
    background: #141929;
    border: 1px solid #1e2d4a;
    border-radius: 14px;
    padding: 18px 22px;
    margin-bottom: 24px;
    display: none;
  }
  .match-info.show { display: block; }
  .match-info h2 { font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
  .match-info .meta { display: flex; gap: 16px; flex-wrap: wrap; }
  .badge {
    font-size: 0.78rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    background: #1e2d4a;
    color: #8ea4c8;
  }
  .badge.xg { background: #0d2e1a; color: #34d47a; }
  .badge.lower { background: #2e1a0d; color: #f0a034; }
  .badge.live { background: #2e0d0d; color: #ff4f4f; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  .endpoints-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
    gap: 14px;
  }
  .endpoint-card {
    background: #141929;
    border: 1px solid #1e2d4a;
    border-radius: 14px;
    overflow: hidden;
  }
  .endpoint-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .endpoint-header:hover { background: #1a2238; }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #2a3352;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.ok { background: #34d47a; }
  .status-dot.error { background: #ff4f4f; }
  .status-dot.loading { background: #f0a034; animation: pulse 0.8s infinite; }
  .status-dot.skipped { background: #4a5a78; }

  .endpoint-name { font-weight: 600; font-size: 0.9rem; flex: 1; }
  .endpoint-url { font-size: 0.72rem; color: #4f6a99; font-family: monospace; flex: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .endpoint-tag { font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 10px; flex-shrink: 0; }
  .tag-pre { background: #0d2247; color: #4f8cff; }
  .tag-live { background: #2e0d0d; color: #ff6b6b; }
  .tag-post { background: #1a1a0d; color: #c8b400; }

  .endpoint-body {
    display: none;
    border-top: 1px solid #1e2d4a;
    padding: 14px 18px;
  }
  .endpoint-body.open { display: block; }

  .data-summary {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .field-chip {
    font-size: 0.73rem;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 500;
  }
  .field-chip.avail { background: #0d2e1a; color: #34d47a; }
  .field-chip.missing { background: #2e0d0d; color: #ff6b6b; }

  pre {
    background: #0d1120;
    border-radius: 8px;
    color: #8ea4c8;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 0.75rem;
    max-height: 300px;
    overflow: auto;
    padding: 12px;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .summary-bar {
    background: #141929;
    border: 1px solid #1e2d4a;
    border-radius: 14px;
    display: none;
    gap: 20px;
    margin-bottom: 24px;
    padding: 16px 22px;
    flex-wrap: wrap;
  }
  .summary-bar.show { display: flex; }
  .summary-stat { text-align: center; }
  .summary-stat .num { font-size: 1.6rem; font-weight: 800; }
  .summary-stat .label { font-size: 0.75rem; color: #6b7a99; }
  .num.green { color: #34d47a; }
  .num.red { color: #ff4f4f; }
  .num.yellow { color: #f0a034; }

  .log-area {
    background: #0d1120;
    border: 1px solid #1e2d4a;
    border-radius: 10px;
    color: #5a7a9a;
    font-family: monospace;
    font-size: 0.75rem;
    height: 120px;
    margin-top: 24px;
    overflow-y: auto;
    padding: 12px;
  }
  .log-area .log-ok { color: #34d47a; }
  .log-area .log-err { color: #ff4f4f; }
  .log-area .log-info { color: #4f8cff; }
</style>
</head>
<body>

<header>
  <div style="font-size:1.8rem">⚽</div>
  <div>
    <h1>ZetaSports — FotMob API Tester</h1>
    <span>Test all API endpoints for any match</span>
  </div>
</header>

<div class="search-bar">
  <input id="matchInput" type="text"
    placeholder="Paste FotMob URL or Match ID — e.g. https://www.fotmob.com/matches/portugal-vs-wales/1nmd3x#5181862"
    value="https://www.fotmob.com/matches/portugal-vs-wales/1nmd3x#5181862" />
  <button class="btn" id="testBtn" onclick="runTests()">Test All</button>
</div>

<div class="match-info" id="matchInfo">
  <h2 id="matchTitle"></h2>
  <div class="meta" id="matchMeta"></div>
</div>

<div class="summary-bar" id="summaryBar">
  <div class="summary-stat"><div class="num green" id="countOk">0</div><div class="label">Available</div></div>
  <div class="summary-stat"><div class="num red" id="countErr">0</div><div class="label">Failed</div></div>
  <div class="summary-stat"><div class="num yellow" id="countSkip">0</div><div class="label">Skipped</div></div>
  <div class="summary-stat"><div class="num" id="countTotal" style="color:#8ea4c8">0</div><div class="label">Total Calls</div></div>
</div>

<div class="endpoints-grid" id="endpointsGrid"></div>

<div class="log-area" id="logArea"></div>

<script>
const PROXY = '/proxy?url=';
let buildId = null;
let stats = { ok: 0, err: 0, skip: 0 };

function log(msg, cls = '') {
  const el = document.getElementById('logArea');
  const line = document.createElement('div');
  if (cls) line.className = 'log-' + cls;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function extractMatchId(input) {
  const trimmed = input.trim();
  const hashMatch = trimmed.match(/#(\d{5,10})$/);
  if (hashMatch) return hashMatch[1];
  const numMatch = trimmed.match(/^(\d{5,10})$/);
  if (numMatch) return numMatch[1];
  return null;
}

function badge(text, cls = '') {
  return `<span class="badge ${cls}">${text}</span>`;
}

function updateSummary() {
  document.getElementById('countOk').textContent = stats.ok;
  document.getElementById('countErr').textContent = stats.err;
  document.getElementById('countSkip').textContent = stats.skip;
  document.getElementById('countTotal').textContent = stats.ok + stats.err + stats.skip;
}

function createCard(id, name, url, phase, note = '') {
  const card = document.createElement('div');
  card.className = 'endpoint-card';
  card.id = `card-${id}`;
  card.innerHTML = `
    <div class="endpoint-header" onclick="toggleBody('${id}')">
      <div class="status-dot" id="dot-${id}"></div>
      <div class="endpoint-name">${name}</div>
      <div class="endpoint-url" id="url-${id}">${url || 'Pending...'}</div>
      <div class="endpoint-tag tag-${phase}">${phase}</div>
    </div>
    <div class="endpoint-body" id="body-${id}">
      ${note ? `<div style="font-size:0.78rem;color:#6b7a99;margin-bottom:10px">${note}</div>` : ''}
      <div class="data-summary" id="fields-${id}"></div>
      <pre id="pre-${id}">Waiting...</pre>
    </div>
  `;
  return card;
}

function toggleBody(id) {
  const body = document.getElementById(`body-${id}`);
  body.classList.toggle('open');
}

function setStatus(id, status) {
  const dot = document.getElementById(`dot-${id}`);
  dot.className = `status-dot ${status}`;
}

function setUrl(id, url) {
  const el = document.getElementById(`url-${id}`);
  if (el) el.textContent = url;
}

function setResult(id, json, fields = []) {
  const pre = document.getElementById(`pre-${id}`);
  const fieldsEl = document.getElementById(`fields-${id}`);
  if (pre) pre.textContent = JSON.stringify(json, null, 2).substring(0, 3000);
  if (fieldsEl && fields.length) {
    fieldsEl.innerHTML = fields.map(f =>
      `<span class="field-chip ${f.ok ? 'avail' : 'missing'}">${f.ok ? '✓' : '✗'} ${f.name}</span>`
    ).join('');
  }
}

async function proxyGet(url, gzip = false) {
  const encoded = encodeURIComponent(url);
  const r = await fetch(`${PROXY}${encoded}&gzip=${gzip ? 1 : 0}`);
  return r.json();
}

async function getBuildId() {
  log('Getting FotMob buildId...', 'info');
  const r = await fetch('/buildid');
  const j = await r.json();
  buildId = j.buildId;
  log(`BuildId: ${buildId}`, 'ok');
  return buildId;
}

async function runTests() {
  const input = document.getElementById('matchInput').value;
  const matchId = extractMatchId(input);
  if (!matchId) {
    alert('Could not extract match ID. Paste a FotMob URL or just the numeric match ID.');
    return;
  }

  stats = { ok: 0, err: 0, skip: 0 };
  document.getElementById('endpointsGrid').innerHTML = '';
  document.getElementById('matchInfo').classList.remove('show');
  document.getElementById('summaryBar').classList.remove('show');
  document.getElementById('logArea').innerHTML = '';
  document.getElementById('testBtn').disabled = true;

  log(`Testing match ID: ${matchId}`, 'info');

  // Get buildId
  const bid = await getBuildId();
  const grid = document.getElementById('endpointsGrid');

  // ── 1. Main match JSON ───────────────────────────────────────────────────
  const matchUrl = `https://www.fotmob.com/_next/data/${bid}/en/match/${matchId}.json`;
  const matchCard = createCard('match', '1. Match Details', matchUrl, 'pre', 'Core match data: teams, lineup, stats, weather, referee, H2H');
  grid.appendChild(matchCard);
  setStatus('match', 'loading');
  setUrl('match', matchUrl);
  document.getElementById('summaryBar').classList.add('show');

  log('Fetching match details...', 'info');
  const matchResult = await proxyGet(matchUrl);
  const matchData = matchResult.data;

  if (!matchData?.pageProps?.general) {
    setStatus('match', 'error');
    setResult('match', matchResult);
    log('Match details FAILED', 'err');
    stats.err++;
    updateSummary();
    document.getElementById('testBtn').disabled = false;
    return;
  }
  setStatus('match', 'ok');
  stats.ok++;

  const g = matchData.pageProps.general;
  const c = matchData.pageProps.content;
  const mf = c?.matchFacts;
  const coverage = g.coverageLevel;

  // Show match info
  document.getElementById('matchInfo').classList.add('show');
  document.getElementById('matchTitle').textContent = `${g.homeTeam?.name} vs ${g.awayTeam?.name}`;
  document.getElementById('matchMeta').innerHTML = [
    badge(g.leagueName),
    badge(`Round ${g.matchRound || '?'}`),
    badge(`Coverage: ${coverage}`, coverage === 'xG' ? 'xg' : 'lower'),
    g.started && !g.finished ? badge('LIVE', 'live') : '',
    g.finished ? badge('Finished') : '',
    !g.started ? badge('Pre-match') : '',
  ].join('');

  // Check available fields
  const weather = c?.weather;
  const referee = mf?.infoBox?.Referee;
  const stadium = mf?.infoBox?.Stadium;
  const lineup = c?.lineup;
  const h2h = c?.h2h;

  setResult('match', matchData.pageProps?.general, [
    { name: 'Teams', ok: !!g.homeTeam },
    { name: 'Weather', ok: !!weather?.temperature },
    { name: 'Referee', ok: !!(referee?.text) },
    { name: 'Ref Stats', ok: !!(referee?.stats?.length) },
    { name: 'Stadium', ok: !!stadium?.name },
    { name: 'Lineup', ok: lineup?.lineupType !== 'unavailable' },
    { name: 'H2H', ok: !!h2h?.summary },
    { name: 'Stats', ok: !!(c?.stats?.Periods?.All?.stats?.length) },
    { name: 'Shotmap', ok: !!(c?.shotmap?.shots?.length) },
    { name: 'Momentum', ok: !!(c?.momentum?.main?.data?.length) },
    { name: 'Team Form', ok: !!(mf?.teamForm?.length) },
    { name: 'xG', ok: coverage === 'xG' },
  ]);
  log(`✓ Match: ${g.homeTeam?.name} vs ${g.awayTeam?.name} | Coverage: ${coverage}`, 'ok');
  updateSummary();

  const homeTeamId = g.homeTeam?.id;
  const awayTeamId = g.awayTeam?.id;
  const leagueId = g.leagueId || g.parentLeagueId;

  // ── 2. League Table ─────────────────────────────────────────────────────
  const tableUrl = `https://data.fotmob.com/tables.ext.${leagueId}.fot.gz`;
  const tableCard = createCard('table', '2. League Table', tableUrl, 'pre', 'Full standings — gzipped file, decompressed server-side');
  grid.appendChild(tableCard);
  setStatus('table', 'loading');
  log('Fetching league table (gzip)...', 'info');
  const tableResult = await proxyGet(tableUrl, true);
  if (tableResult.error || tableResult.data?._error) {
    setStatus('table', 'error');
    setResult('table', tableResult);
    log(`✗ League table failed: ${tableResult.error || tableResult.data?._error}`, 'err');
    stats.err++;
  } else {
    setStatus('table', 'ok');
    setResult('table', tableResult.data, [
      { name: 'Parsed JSON', ok: true },
      { name: 'League ID', ok: !!leagueId },
    ]);
    log(`✓ League table fetched (leagueId: ${leagueId})`, 'ok');
    stats.ok++;
  }
  updateSummary();

  // ── 3. Home Team Profile ─────────────────────────────────────────────────
  const homeUrl = `https://www.fotmob.com/api/teams?id=${homeTeamId}`;
  const homeCard = createCard('home_team', `3. Home Team — ${g.homeTeam?.name}`, homeUrl, 'pre');
  grid.appendChild(homeCard);
  setStatus('home_team', 'loading');
  log(`Fetching home team (${homeTeamId})...`, 'info');
  const homeResult = await proxyGet(homeUrl);
  if (homeResult.data?._error) {
    setStatus('home_team', 'error'); stats.err++;
    setResult('home_team', homeResult.data);
    log(`✗ Home team failed`, 'err');
  } else {
    setStatus('home_team', 'ok'); stats.ok++;
    const td = homeResult.data;
    setResult('home_team', td, [
      { name: 'Team name', ok: !!td?.details?.name },
      { name: 'Country', ok: !!td?.details?.country },
      { name: 'Squad', ok: !!(td?.squad?.length || td?.members?.length) },
    ]);
    log(`✓ Home team profile loaded`, 'ok');
  }
  updateSummary();

  // ── 4. Away Team Profile ─────────────────────────────────────────────────
  const awayUrl = `https://www.fotmob.com/api/teams?id=${awayTeamId}`;
  const awayCard = createCard('away_team', `4. Away Team — ${g.awayTeam?.name}`, awayUrl, 'pre');
  grid.appendChild(awayCard);
  setStatus('away_team', 'loading');
  log(`Fetching away team (${awayTeamId})...`, 'info');
  const awayResult = await proxyGet(awayUrl);
  if (awayResult.data?._error) {
    setStatus('away_team', 'error'); stats.err++;
    setResult('away_team', awayResult.data);
    log(`✗ Away team failed`, 'err');
  } else {
    setStatus('away_team', 'ok'); stats.ok++;
    setResult('away_team', awayResult.data);
    log(`✓ Away team profile loaded`, 'ok');
  }
  updateSummary();

  // ── 5. Player Profiles ───────────────────────────────────────────────────
  if (lineup && lineup.lineupType !== 'unavailable') {
    const starters = [
      ...(lineup.homeTeam?.starters || []),
      ...(lineup.awayTeam?.starters || []),
    ].slice(0, 4); // test first 4 only in demo

    for (const [i, p] of starters.entries()) {
      const pUrl = `https://www.fotmob.com/api/playerData?id=${p.id}`;
      const pCard = createCard(`player_${p.id}`, `5.${i+1} Player — ${p.name}`, pUrl, 'pre');
      grid.appendChild(pCard);
      setStatus(`player_${p.id}`, 'loading');

      const pResult = await proxyGet(pUrl);
      if (pResult.data?._error) {
        setStatus(`player_${p.id}`, 'error'); stats.err++;
        setResult(`player_${p.id}`, pResult.data);
        log(`✗ Player ${p.name} failed`, 'err');
      } else {
        setStatus(`player_${p.id}`, 'ok'); stats.ok++;
        const pd = pResult.data;
        setResult(`player_${p.id}`, pd, [
          { name: 'Name', ok: !!pd?.name },
          { name: 'Height', ok: !!pd?.bio?.height },
          { name: 'Season stats', ok: !!(pd?.statSections?.length || pd?.careerStatistics?.length) },
        ]);
        log(`✓ Player ${p.name} loaded`, 'ok');
      }
      updateSummary();
      await new Promise(r => setTimeout(r, 300));
    }
    if ((lineup.homeTeam?.starters?.length || 0) + (lineup.awayTeam?.starters?.length || 0) > 4) {
      const remaining = ((lineup.homeTeam?.starters?.length || 0) + (lineup.awayTeam?.starters?.length || 0)) - 4;
      const skipCard = createCard('players_rest', `5.+ ${remaining} More Players`, '(in full run)', 'pre', 'Only 4 shown in demo — full run fetches all');
      grid.appendChild(skipCard);
      setStatus('players_rest', 'skipped');
      stats.skip += remaining;
      updateSummary();
    }
  } else {
    const skipCard = createCard('lineup_skip', '5. Player Profiles', 'N/A', 'pre', 'Lineup unavailable for this match (lower coverage)');
    grid.appendChild(skipCard);
    setStatus('lineup_skip', 'skipped');
    stats.skip++;
    updateSummary();
  }

  // ── 6. Heatmap ─────────────────────────────────────────────────────────
  const heatmapUrlPath = c?.heatmapUrl;
  if (heatmapUrlPath) {
    const heatUrl = `https://www.fotmob.com${heatmapUrlPath}`;
    const heatCard = createCard('heatmap', '6. Heatmap', heatUrl, 'post', 'Available post-match');
    grid.appendChild(heatCard);
    setStatus('heatmap', 'loading');
    const hResult = await proxyGet(heatUrl);
    if (hResult.data?._error || hResult.status >= 400) {
      setStatus('heatmap', 'error'); stats.err++;
      log(`✗ Heatmap failed (probably post-match only)`, 'err');
    } else {
      setStatus('heatmap', 'ok'); stats.ok++;
      setResult('heatmap', hResult.data);
      log(`✓ Heatmap loaded`, 'ok');
    }
  } else {
    const heatCard = createCard('heatmap', '6. Heatmap', 'N/A', 'post', 'Not available for this match');
    grid.appendChild(heatCard);
    setStatus('heatmap', 'skipped');
    stats.skip++;
  }
  updateSummary();

  // ── Done ────────────────────────────────────────────────────────────────
  log(`All done! ✓${stats.ok} ✗${stats.err} ⊘${stats.skip}`, 'ok');
  document.getElementById('testBtn').disabled = false;
}
</script>
</body>
</html>
