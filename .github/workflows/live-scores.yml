name: Live Scores Sync

on:
  schedule:
    # Run every 5 minutes (GitHub Free minimum cron interval)
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-live-scores
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: data-pipeline/package.json

      - name: Install Data Pipeline Dependencies
        run: npm ci --prefix data-pipeline

      - name: Run Live Scores Synchronization
        run: npm run sync:live --prefix data-pipeline

      - name: Safe Git Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "✅ No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): sync live scores [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin main || true
            echo "🚀 Live data pushed to GitHub."
          fi
