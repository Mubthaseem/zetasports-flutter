name: Live Score & Telemetry Synchronizer

on:
  schedule:
    # Run every 5 minutes (standard GitHub Actions cron interval)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Manual trigger from GitHub Actions or Admin Panel

permissions:
  contents: write

concurrency:
  group: sync-live-scores
  cancel-in-progress: false

jobs:
  sync-live-everything:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          echo "📦 Installing data-pipeline and scripts dependencies..."
          npm ci --prefix data-pipeline || npm install --prefix data-pipeline
          npm install --prefix scripts

      - name: Sync Data Pipeline (Updates GitHub Pages Web Hub data/)
        run: |
          echo "🌐 Syncing data/ files for GitHub Pages..."
          npm run sync:live --prefix data-pipeline

      - name: Run Supabase Live Updater (Updates Supabase for App & Admin Panel)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://voocdrpetiyspuhyeapi.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY || 'sb_publishable_luDUt769BBrrApn8z-Cgvw_W9VE0rIV' }}
        run: |
          echo "🚀 Updating Supabase matches, standings, and telemetry..."
          node scripts/live_score_updater.mjs

      - name: Commit and Push GitHub Pages Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "✅ No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): auto-sync live matches and freshness meta [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin main || true
            echo "🚀 Fresh live data pushed to GitHub repository."
          fi
