name: Historical Results Maintenance

on:
  schedule:
    # Runs daily at 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: sync-historical
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: data-pipeline/package.json

      - name: Install Dependencies
        run: npm ci --prefix data-pipeline

      - name: Run Historical Maintenance
        run: npm run sync:historical --prefix data-pipeline

      - name: Safe Git Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "✅ No historical changes to commit."
          else
            git commit -m "chore(data): archive historical match results [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin main || true
            echo "🚀 Historical results updated."
          fi
