name: Football News Sync

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: data-pipeline/package.json

      - name: Install Dependencies
        run: npm ci --prefix data-pipeline

      - name: Run News Synchronization
        run: npm run sync:news --prefix data-pipeline

      - name: Safe Git Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news/latest.json
          if git diff --staged --quiet; then
            echo "✅ No news changes detected. Skipping commit."
          else
            git commit -m "chore(data): sync football news [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "🚀 News updated."
          fi
