name: Match Details Sync

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-match-details
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-details:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: data-pipeline/package.json

      - name: Install Dependencies
        run: npm ci --prefix data-pipeline

      - name: Run Match Details Synchronization
        run: npm run sync:details --prefix data-pipeline

      - name: Safe Git Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches/lineups/ data/matches/statistics/ data/matches/events/
          if git diff --staged --quiet; then
            echo "✅ No match detail changes detected. Skipping commit."
          else
            git commit -m "chore(data): sync lineups, stats & events [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "🚀 Match details updated."
          fi
