name: Standings & Scorers Sync

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-standings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-standings:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: data-pipeline/package.json

      - name: Install Dependencies
        run: npm ci --prefix data-pipeline

      - name: Run Standings & Scorers Synchronization
        run: npm run sync:standings --prefix data-pipeline

      - name: Safe Git Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches/standings/ data/matches/scorers/
          if git diff --staged --quiet; then
            echo "✅ No standings changes detected. Skipping commit."
          else
            git commit -m "chore(data): sync league standings & top scorers [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "🚀 Standings and scorers updated."
          fi
