name: zetasports
description: "ZetaSports — Live Sports Streaming App"
publish_to: 'none'

version: 1.2.1+20

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Backend (Supabase only)
  supabase_flutter: ^2.6.0

  # ── Ads
  google_mobile_ads: ^5.3.0

  # ── Fonts & UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.3.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # ── Utilities
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.0
  intl: ^0.20.0
  timeago: ^3.6.1
  crypto: ^3.0.3
  video_player: ^2.9.1
  chewie: ^1.8.5
  webview_flutter: ^4.8.0
  onesignal_flutter: ^5.1.2

  # ── Media

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - shorebird.yaml
