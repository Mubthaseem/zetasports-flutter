name: zetasports
description: ZETASPORTS - Live Football Scores & Streams
publish_to: 'none'
version: 1.1.1+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.0
  cloud_firestore: ^5.1.0
  firebase_messaging: ^15.0.1

  # Player
  webview_flutter: ^4.7.0

  # UI & Images
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Utilities
  url_launcher: ^6.3.0
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.3
  shared_preferences: ^2.5.5
  timeago: ^3.6.1
  google_mobile_ads: ^8.0.0
  app_tracking_transparency: ^2.0.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - shorebird.yaml
