<!--
  ============================================================
  ZetaSports – FotMob-style Match Widget
  White cards · League header · Centered logos · Live minute
  ============================================================
-->
<div id="zs-root">

  <!-- Date Tab Bar -->
  <div class="zs-date-bar">
    <button class="zs-dtab" data-date="yesterday">
      Yesterday <span class="zs-cnt" id="cnt-yesterday">0</span>
    </button>
    <button class="zs-dtab active" data-date="today">
      Today <span class="zs-cnt" id="cnt-today">0</span>
    </button>
    <button class="zs-dtab" data-date="tomorrow">
      Tomorrow <span class="zs-cnt" id="cnt-tomorrow">0</span>
    </button>
  </div>

  <!-- Match Cards -->
  <div id="zs-list">
    <div class="zs-spinner-wrap">
      <div class="zs-spin"></div>
    </div>
  </div>

</div>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ── Base reset scoped to widget ─────────────────────── */
#zs-root, #zs-root * {
  box-sizing: border-box;
  margin: 0; padding: 0;
  font-family: 'Inter', -apple-system, sans-serif;
}

#zs-root {
  background: #eef0f6;
  padding: 16px 12px 20px;
  border-radius: 16px;
  max-width: 860px;
  margin: 12px auto;
}

/* ── Date Tab Bar ────────────────────────────────────── */
.zs-date-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-bottom: 14px;
}

.zs-dtab {
  display: flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: none;
  color: #64748b;
  font-size: 13.5px;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.zs-dtab:hover {
  color: #1e293b;
}

.zs-dtab.active {
  background: #1a1a2e;
  color: #fff;
}

/* Count badge */
.zs-cnt {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  background: rgba(100,116,139,0.18);
  color: #64748b;
}

.zs-dtab.active .zs-cnt {
  background: rgba(255,255,255,0.18);
  color: #fff;
}

/* ── Match List ──────────────────────────────────────── */
#zs-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 200px;
}

/* ── Match Card ──────────────────────────────────────── */
.zs-card {
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 1px 6px rgba(15,23,42,0.07);
  text-decoration: none;
  color: inherit;
  display: block;
  transition: box-shadow 0.2s ease, transform 0.2s ease;
}

a.zs-card:hover {
  box-shadow: 0 6px 20px rgba(15,23,42,0.12);
  transform: translateY(-1px);
}

/* ── Card Header ─────────────────────────────────────── */
.zs-ch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 14px 8px;
  border-bottom: 1px solid #f1f5f9;
}

.zs-ch-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.zs-league-icon {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  object-fit: contain;
  background: #f1f5f9;
  flex-shrink: 0;
}

.zs-league-name {
  font-size: 13px;
  font-weight: 700;
  color: #1e293b;
  line-height: 1.3;
}

.zs-league-round {
  font-size: 11px;
  color: #3b82f6;
  font-weight: 500;
  margin-top: 1px;
}

/* Status badges */
.zs-badge {
  font-size: 10.5px;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 999px;
  letter-spacing: 0.3px;
  flex-shrink: 0;
}

.zs-badge.live {
  background: #fb7185;
  color: #fff;
  animation: zs-live-pulse 1.8s infinite;
}

.zs-badge.upcoming {
  background: #dbeafe;
  color: #2563eb;
}

.zs-badge.finished {
  background: #f1f5f9;
  color: #64748b;
}

/* ── Card Body: Teams + Score ────────────────────────── */
.zs-cb {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 18px 16px 14px;
  gap: 8px;
}

/* Team column: logo on top, name below, centered */
.zs-team-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.zs-team-col.home {
  align-items: center;
}

.zs-team-col.away {
  align-items: center;
}

.zs-logo {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  object-fit: contain;
  background: #f8fafc;
  flex-shrink: 0;
}

.zs-tname {
  font-size: 13px;
  font-weight: 700;
  color: #1e293b;
  text-align: center;
  line-height: 1.3;
}

/* Score/VS center column */
.zs-score-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-width: 100px;
}

.zs-score {
  font-size: 30px;
  font-weight: 900;
  color: #0f172a;
  letter-spacing: -0.5px;
  line-height: 1;
}

.zs-vs {
  font-size: 22px;
  font-weight: 800;
  color: #cbd5e1;
  line-height: 1;
}

/* Live minute indicator */
.zs-minute {
  font-size: 13px;
  font-weight: 700;
  color: #22c55e;
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.zs-live-dot {
  font-size: 8px;
  color: #ef4444;
  animation: zs-live-pulse 1.2s infinite;
}

@keyframes zs-live-pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.2; }
}

.zs-ko-time {
  font-size: 13px;
  font-weight: 600;
  color: #94a3b8;
  margin-top: 2px;
}

/* ── Card Footer ─────────────────────────────────────── */
.zs-cf {
  border-top: 1px solid #f1f5f9;
  padding: 8px 14px 10px;
}

.zs-cf-label {
  font-size: 11px;
  color: #94a3b8;
  font-weight: 500;
  margin-bottom: 2px;
}

.zs-cf-value {
  font-size: 15px;
  font-weight: 800;
  color: #1e293b;
  letter-spacing: -0.2px;
}

/* Live minute in footer */
.zs-cf-value.is-live {
  color: #22c55e;
}

/* ── Play overlay (cards with watch_url) ─────────────── */
.zs-play-wrap {
  position: relative;
}

.zs-play-overlay {
  position: absolute;
  inset: 0;
  background: rgba(37, 99, 235, 0.07);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.22s ease;
  pointer-events: none;
  border-radius: inherit;
}

a.zs-card:hover .zs-play-overlay {
  opacity: 1;
}

.zs-play-btn {
  width: 50px;
  height: 50px;
  background: #2563eb;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 18px rgba(37,99,235,0.4);
  transform: scale(0.82);
  transition: transform 0.22s cubic-bezier(0.16,1,0.3,1);
}

a.zs-card:hover .zs-play-btn {
  transform: scale(1);
}

.zs-play-icon {
  width: 0; height: 0;
  border: solid transparent;
  border-width: 8px 0 8px 15px;
  border-left-color: #fff;
  margin-left: 3px;
}

/* ── Loading / Empty ─────────────────────────────────── */
.zs-spinner-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 60px 0;
}

.zs-spin {
  width: 32px; height: 32px;
  border: 3px solid #e2e8f0;
  border-top-color: #2563eb;
  border-radius: 50%;
  animation: zs-rot 0.75s linear infinite;
}

.zs-empty {
  text-align: center;
  padding: 50px 20px;
  color: #94a3b8;
}

.zs-empty-icon { font-size: 36px; margin-bottom: 10px; }

.zs-empty h3 {
  font-size: 15px;
  font-weight: 700;
  color: #475569;
  margin-bottom: 4px;
}

.zs-empty p { font-size: 13px; }

/* ── Animations ─────────────────────────────────────── */
@keyframes zs-rot { to { transform: rotate(360deg); } }

@keyframes zs-live-pulse {
  0%   { box-shadow: 0 0 0 0 rgba(251,113,133,0.5); }
  70%  { box-shadow: 0 0 0 6px rgba(251,113,133,0); }
  100% { box-shadow: 0 0 0 0 rgba(251,113,133,0); }
}

/* ── Responsive ─────────────────────────────────────── */
@media (max-width: 520px) {
  #zs-root {
    padding: 12px 8px 16px;
    border-radius: 12px;
    margin: 8px 4px;
  }

  .zs-dtab {
    font-size: 12px;
    padding: 7px 12px;
    gap: 4px;
  }

  .zs-logo {
    width: 52px;
    height: 52px;
  }

  .zs-score {
    font-size: 22px;
  }

  .zs-vs {
    font-size: 17px;
  }

  .zs-tname {
    font-size: 11.5px;
  }

  .zs-score-col {
    min-width: 74px;
  }

  .zs-cb {
    padding: 14px 10px 10px;
    gap: 4px;
  }

  .zs-ch {
    padding: 9px 10px 7px;
  }

  .zs-league-name {
    font-size: 11.5px;
  }

  .zs-league-round {
    font-size: 10px;
  }

  .zs-badge {
    font-size: 9.5px;
    padding: 3px 8px;
  }

  .zs-cf {
    padding: 7px 10px 9px;
  }

  .zs-cf-value {
    font-size: 13.5px;
  }
}

@media (max-width: 360px) {
  .zs-logo {
    width: 42px;
    height: 42px;
  }

  .zs-score {
    font-size: 18px;
  }

  .zs-score-col {
    min-width: 60px;
  }

  .zs-tname {
    font-size: 10px;
  }

  .zs-dtab {
    padding: 6px 9px;
    font-size: 11px;
  }
}
</style>

<script>
(function () {
  const JSON_URL = 'https://raw.githubusercontent.com/Mubthaseem/zetasports-flutter/main/blogger-widgets/matches.json';
  const POLL_MS  = 30000;
  const FALLBACK = 'https://i.ibb.co/qF41b08G/HELLO-THUM.png';

  let allMatches  = [];
  let activeDate  = 'today';
  let cdTimers    = [];

  // ── Boot ──────────────────────────────────────────────
  function boot() {
    const root = document.getElementById('zs-root');
    if (!root) return;
    root.querySelectorAll('.zs-dtab').forEach(btn => {
      btn.addEventListener('click', () => {
        root.querySelectorAll('.zs-dtab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeDate = btn.getAttribute('data-date');
        render();
      });
    });
    load();
    setInterval(load, POLL_MS);
  }

  // ── Fetch ─────────────────────────────────────────────
  async function load() {
    try {
      const r = await fetch(JSON_URL + '?_=' + Date.now());
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      if (d && Array.isArray(d.matches)) {
        allMatches = d.matches;
        updateCounts();
        render();
      }
    } catch (e) {
      console.warn('[ZetaSports] fetch failed', e);
      if (!allMatches.length) showErr();
    }
  }

  // ── Date helpers ──────────────────────────────────────
  function dateCat(iso) {
    const m  = new Date(iso);
    const t  = new Date();
    const md = new Date(m.getFullYear(), m.getMonth(), m.getDate()).getTime();
    const td = new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
    const d  = Math.round((md - td) / 86400000);
    if (d <= -1) return 'yesterday';
    if (d === 0)  return 'today';
    return 'tomorrow';
  }

  function updateCounts() {
    ['yesterday','today','tomorrow'].forEach(k => {
      const n = allMatches.filter(m => dateCat(m.date) === k).length;
      const el = document.getElementById('cnt-' + k);
      if (el) el.textContent = n;
    });
  }

  // ── Render ────────────────────────────────────────────
  function render() {
    cdTimers.forEach(clearInterval);
    cdTimers = [];

    const list = document.getElementById('zs-list');
    if (!list) return;

    const matches = allMatches.filter(m => dateCat(m.date) === activeDate);

    if (!matches.length) {
      list.innerHTML = `
        <div class="zs-empty">
          <div class="zs-empty-icon">📅</div>
          <h3>No matches scheduled</h3>
          <p>No matches for ${activeDate}.</p>
        </div>`;
      return;
    }

    list.innerHTML = '';

    // Pin live matches to top, then upcoming (soonest first), then finished
    const sorted = [...matches].sort((a, b) => {
      const rank = m => m.is_live ? 0 : m.is_finished ? 2 : 1;
      if (rank(a) !== rank(b)) return rank(a) - rank(b);
      // Within same group: sort by kickoff time ascending
      return new Date(a.date) - new Date(b.date);
    });

    sorted.forEach((m, i) => list.appendChild(buildCard(m, i)));
  }

  // ── Build card ────────────────────────────────────────
  function buildCard(m, idx) {
    const hasLink = m.watch_url && m.watch_url.startsWith('http');
    const el = document.createElement(hasLink ? 'a' : 'div');
    el.className = 'zs-card' + (hasLink ? ' zs-play-wrap' : '');
    if (hasLink) {
      el.href   = m.watch_url;
      el.target = '_blank';
      el.rel    = 'noopener noreferrer';
    }

    // Auto-detect finished matches by elapsed time
    // (handles cases where backend scraper is slow to mark match as FT)
    let isLive     = m.is_live;
    let isFinished = m.is_finished;
    if (isLive && m.date) {
      const minsElapsed = (Date.now() - new Date(m.date)) / 60000;
      if (minsElapsed > 115) {   // 90min match + 25min buffer
        isLive     = false;
        isFinished = true;       // treat as finished on client side
      }
    }

    // Status badge
    let badgeClass = 'upcoming', badgeText = 'UPCOMING';
    if (isLive)     { badgeClass = 'live';     badgeText = 'LIVE'; }
    if (isFinished) { badgeClass = 'finished'; badgeText = 'FT'; }

    // League icon: use fotmob league image or fallback emoji
    const leagueIcon = m.league_logo || FALLBACK;

    // Score center
    let scoreHTML = '';
    let footLabel = '', footVal = '', footValClass = '';
    const cdId = `zs-cd-${idx}`;

    if (isLive) {
      // live_minute from scraper (e.g. "45'", "HT") — fall back to auto-elapsed
      const liveMinDisp = m.live_minute ? esc(m.live_minute) : computeElapsed(m.date);
      scoreHTML = `
        <div class="zs-score">${esc(m.home_score)} - ${esc(m.away_score)}</div>
        <div class="zs-minute"><span class="zs-live-dot">&#9679;</span> ${liveMinDisp}</div>`;
      footLabel   = 'Live';
      footVal     = liveMinDisp;
      footValClass = 'is-live';
    } else if (isFinished) {
      scoreHTML = `<div class="zs-score">${esc(m.home_score)} - ${esc(m.away_score)}</div>`;
      footLabel = 'Full Time';
      footVal   = `${esc(m.home_score)} - ${esc(m.away_score)}`;
    } else {
      scoreHTML = `
        <div class="zs-vs">VS</div>
        <div class="zs-ko-time">${esc(m.time)}</div>`;
      footLabel = 'Kickoff in';
      footVal   = '';  // filled by countdown
    }

    el.innerHTML = `
      <!-- Header -->
      <div class="zs-ch">
        <div class="zs-ch-left">
          <img class="zs-league-icon" src="${esc(leagueIcon)}" alt="" onerror="this.src='${FALLBACK}'">
          <div>
            <div class="zs-league-name">${esc(m.league)}</div>
            <div class="zs-league-round">${esc(m.group || 'Round')}</div>
          </div>
        </div>
        <span class="zs-badge ${badgeClass}">${badgeText}</span>
      </div>

      <!-- Body -->
      <div class="zs-cb">
        <div class="zs-team-col home">
          <img class="zs-logo" src="${esc(m.home_logo)}" alt="${esc(m.home_team)}" onerror="this.onerror=null;this.src='${FALLBACK}'">
          <span class="zs-tname">${esc(m.home_team)}</span>
        </div>
        <div class="zs-score-col">${scoreHTML}</div>
        <div class="zs-team-col away">
          <img class="zs-logo" src="${esc(m.away_logo)}" alt="${esc(m.away_team)}" onerror="this.onerror=null;this.src='${FALLBACK}'">
          <span class="zs-tname">${esc(m.away_team)}</span>
        </div>
      </div>

      <!-- Footer -->
      <div class="zs-cf">
        <div class="zs-cf-label">${footLabel}</div>
        <div class="zs-cf-value ${footValClass}" id="${cdId}-foot">${footVal}</div>
      </div>

      ${hasLink ? '<div class="zs-play-overlay"><div class="zs-play-btn"><div class="zs-play-icon"></div></div></div>' : ''}
    `;

    // Start countdown for upcoming
    if (!m.is_live && !m.is_finished) {
      startCountdown(m.date, cdId + '-foot');
    }

    return el;
  }

  // ── Countdown ─────────────────────────────────────────
  function startCountdown(iso, elId) {
    const target = new Date(iso).getTime();
    const tick = () => {
      const el = document.getElementById(elId);
      if (!el) return;
      const diff = target - Date.now();
      if (diff <= 0) { el.textContent = 'Starting…'; return; }
      const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
      const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
      const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
      el.textContent = `${h}:${m}:${s}`;
    };
    tick();
    cdTimers.push(setInterval(tick, 1000));
  }

  function showErr() {
    const list = document.getElementById('zs-list');
    if (list) list.innerHTML = `
      <div class="zs-empty">
        <div class="zs-empty-icon">⚠️</div>
        <h3>Couldn't load matches</h3>
        <p>Check your connection and try again.</p>
      </div>`;
  }

  // ── Compute elapsed minutes from kickoff (fallback) ──
  function computeElapsed(isoDate) {
    try {
      const kickoff = new Date(isoDate).getTime();
      const elapsed = Math.floor((Date.now() - kickoff) / 60000);
      if (elapsed < 0)  return '';
      if (elapsed <= 45) return elapsed + "'";
      if (elapsed <= 50) return "45+'";
      if (elapsed <= 90) return (elapsed - 45) + "' (2H)";
      return "90+'";
    } catch { return ''; }
  }

  // ── HTML escape ───────────────────────────────────────
  function esc(v) {
    if (v == null) return '';
    return String(v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Boot
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
